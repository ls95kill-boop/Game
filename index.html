<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Сортировка с красными пандами</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: #1d140e;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    /* Стилизованные игровые кнопки в стиле тёплого дерева, бамбука и золота */
    .panda-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-weight: 800;
      color: #fff8ef;
      background: linear-gradient(180deg, #7c4728 0%, #572e17 100%);
      border: 2px solid #b57345;
      border-bottom-width: 4px;
      border-radius: 9999px;
      box-shadow: 0 6px 16px rgba(20, 10, 4, 0.45), inset 0 1px 1px rgba(255, 230, 195, 0.35);
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.14s ease, opacity 0.2s ease;
      cursor: pointer;
    }

    .panda-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .panda-btn:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .panda-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.35);
    }

    .panda-btn-accent {
      background: linear-gradient(180deg, #e2622c 0%, #b53d12 100%);
      border-color: #f69d69;
      box-shadow: 0 6px 18px rgba(190, 62, 18, 0.45), inset 0 1px 1px rgba(255, 240, 220, 0.45);
    }

    .panda-btn-bamboo {
      background: linear-gradient(180deg, #5d8c3e 0%, #3d6325 100%);
      border-color: #96c474;
      box-shadow: 0 6px 18px rgba(46, 82, 24, 0.45), inset 0 1px 1px rgba(235, 255, 215, 0.4);
    }

    .panda-btn-gold {
      background: linear-gradient(180deg, #e09f24 0%, #a86b08 100%);
      border-color: #ffd573;
      color: #fffdf7;
      box-shadow: 0 6px 18px rgba(186, 118, 10, 0.45), inset 0 1px 1px rgba(255, 248, 215, 0.55);
    }

    .panda-btn-indigo {
      background: linear-gradient(180deg, #5465b8 0%, #344185 100%);
      border-color: #96a6f2;
      box-shadow: 0 6px 18px rgba(42, 54, 122, 0.45), inset 0 1px 1px rgba(225, 232, 255, 0.45);
    }

    .hud-pill {
      background: rgba(38, 22, 13, 0.76);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(226, 158, 98, 0.38);
      box-shadow: 0 6px 20px rgba(15, 7, 2, 0.38);
    }

    @keyframes popIn {
      0% { transform: scale(0.78) translateY(16px); opacity: 0; }
      70% { transform: scale(1.03) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-pop {
      animation: popIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Тонкий скроллбар для каталога магазина */
    .shop-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .shop-scroll::-webkit-scrollbar-track {
      background: rgba(25, 12, 6, 0.4);
      border-radius: 999px;
    }
    .shop-scroll::-webkit-scrollbar-thumb {
      background: rgba(212, 140, 78, 0.55);
      border-radius: 999px;
    }
  </style>
</head>
<body class="relative w-full h-full overflow-hidden">

  <!-- Основной игровой холст -->
  <canvas id="gameCanvas"></canvas>

  <!-- Верхняя панель статуса (HUD) -->
  <header class="fixed top-0 left-0 right-0 z-20 pointer-events-none px-2.5 pt-2.5 sm:px-5 sm:pt-3.5">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-1.5 sm:gap-2">
      
      <!-- Левая группа: Уровень, Звёзды и Монеты -->
      <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto">
        <div class="hud-pill rounded-full px-3 py-1 sm:px-3.5 sm:py-1.5 flex items-center gap-1.5 text-amber-50">
          <span class="text-base sm:text-lg">🐾</span>
          <div>
            <div class="text-[9px] sm:text-[10px] uppercase tracking-wider text-amber-200/80 font-bold leading-none">Уровень</div>
            <div id="levelDisplay" class="text-sm sm:text-base font-black leading-tight text-amber-100">1</div>
          </div>
        </div>

        <div class="hud-pill rounded-full px-3 py-1 sm:px-3.5 sm:py-1.5 flex items-center gap-1.5 text-amber-50" title="Всего звёзд">
          <span class="text-base sm:text-lg">⭐</span>
          <div>
            <div class="text-[9px] sm:text-[10px] uppercase tracking-wider text-amber-200/80 font-bold leading-none">Звёзды</div>
            <div id="totalStarsDisplay" class="text-sm sm:text-base font-black leading-tight text-yellow-300">0</div>
          </div>
        </div>

        <div id="coinsHudPill" class="hud-pill rounded-full px-3 py-1 sm:px-3.5 sm:py-1.5 flex items-center gap-1.5 text-amber-50 transition-transform duration-200" title="Баланс монет">
          <span class="text-base sm:text-lg">🪙</span>
          <div>
            <div class="text-[9px] sm:text-[10px] uppercase tracking-wider text-amber-200/80 font-bold leading-none">Монеты</div>
            <div id="coinsDisplay" class="text-sm sm:text-base font-black leading-tight text-amber-300">120</div>
          </div>
        </div>
      </div>

      <!-- Центральная группа: Шкала звёзд за уровень и счётчик ходов -->
      <div class="hud-pill rounded-full px-3 py-1 sm:px-4 sm:py-1.5 flex items-center gap-2.5 sm:gap-3.5 pointer-events-auto">
        <div class="flex items-center gap-0.5 sm:gap-1" id="liveStarsContainer" title="Звёзды за текущий уровень">
          <span class="star-icon text-base sm:text-xl transition-transform duration-300 drop-shadow">⭐</span>
          <span class="star-icon text-base sm:text-xl transition-transform duration-300 drop-shadow">⭐</span>
          <span class="star-icon text-base sm:text-xl transition-transform duration-300 drop-shadow">⭐</span>
        </div>
        <div class="h-5 w-px bg-amber-200/20"></div>
        <div class="text-right">
          <div class="text-[9px] sm:text-[10px] uppercase tracking-wider text-amber-200/80 font-bold leading-none">Ходы</div>
          <div class="text-xs sm:text-sm font-black text-amber-50 leading-tight">
            <span id="movesDisplay">0</span> <span class="text-amber-300/75 text-[11px] font-bold">/ <span id="parDisplay">12</span></span>
          </div>
        </div>
      </div>

      <!-- Правая группа: Магазин и Звук -->
      <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto">
        <button id="openShopBtn" class="panda-btn panda-btn-gold px-3 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm">
          <span class="text-base sm:text-lg">🏮</span>
          <span>Магазин</span>
        </button>

        <button id="soundToggleBtn" class="hud-pill rounded-full w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center text-amber-100 hover:bg-amber-900/60 transition active:scale-95" title="Включить или выключить звук" aria-label="Звук">
          <span id="soundIcon" class="text-base sm:text-lg">🔊</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Всплывающая подсказка / уведомление без alert() -->
  <div id="toastBanner" class="fixed top-20 left-1/2 -translate-x-1/2 z-30 pointer-events-none opacity-0 transition-all duration-300">
    <div id="toastText" class="hud-pill text-amber-50 font-bold text-xs sm:text-sm px-4 py-2 rounded-full shadow-xl border border-amber-300/40 whitespace-nowrap">
      Подсказка
    </div>
  </div>

  <!-- Нижняя панель управления и бустеров -->
  <footer class="fixed bottom-0 left-0 right-0 z-20 pointer-events-none px-2 pb-2.5 sm:px-5 sm:pb-4">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-center gap-1.5 sm:gap-2.5 pointer-events-auto">
      
      <!-- Отмена хода -->
      <button id="undoBtn" class="panda-btn px-3 py-2 sm:px-4 sm:py-2.5 text-xs sm:text-sm" disabled title="Отменить последний ход">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        <span>Назад</span>
        <span id="undoBadge" class="bg-amber-950/75 text-amber-200 text-[10px] px-1.5 py-0.5 rounded-full">0</span>
      </button>

      <!-- Перезапуск уровня -->
      <button id="restartBtn" class="panda-btn px-3 py-2 sm:px-4 sm:py-2.5 text-xs sm:text-sm" title="Начать уровень заново">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        <span class="hidden sm:inline">Заново</span>
      </button>

      <!-- Бустер: Подсказка -->
      <button id="hintBtn" class="panda-btn panda-btn-gold px-3 py-2 sm:px-4 sm:py-2.5 text-xs sm:text-sm" title="Подсветить выгодный ход">
        <span>💡 Подсказка</span>
        <span id="hintCostBadge" class="bg-amber-950/75 text-amber-200 text-[10px] px-1.5 py-0.5 rounded-full">Беспл.</span>
      </button>

      <!-- Бустер: Перемешать -->
      <button id="shuffleBtn" class="panda-btn panda-btn-indigo px-3 py-2 sm:px-4 sm:py-2.5 text-xs sm:text-sm" title="Перемешать незавершённые слои">
        <span>🌪️ Микс</span>
        <span id="shuffleCostBadge" class="bg-indigo-950/75 text-indigo-100 text-[10px] px-1.5 py-0.5 rounded-full">Беспл.</span>
      </button>

      <!-- Бустер: +1 Пустая колба -->
      <button id="extraBottleBtn" class="panda-btn panda-btn-bamboo px-3 py-2 sm:px-4 sm:py-2.5 text-xs sm:text-sm" title="Добавить пустую колбу">
        <span>+ Колба</span>
        <span id="extraBottleBadge" class="bg-green-950/75 text-lime-200 text-[10px] px-1.5 py-0.5 rounded-full">Беспл.</span>
      </button>

      <!-- Новый уровень -->
      <button id="newLevelBtn" class="panda-btn panda-btn-accent px-3 py-2 sm:px-4 sm:py-2.5 text-xs sm:text-sm" title="Сгенерировать новый уровень">
        <span class="hidden md:inline">Новый</span>
        <span>➜</span>
      </button>
    </div>
  </footer>

  <!-- Модальное окно Магазина -->
  <div id="shopModal" class="fixed inset-0 z-40 hidden items-center justify-center p-3 sm:p-5 bg-black/65 backdrop-blur-sm">
    <div class="modal-pop relative w-full max-w-3xl max-h-[88vh] flex flex-col rounded-3xl border-2 border-amber-300/60 shadow-2xl overflow-hidden"
         style="background: radial-gradient(circle at top, #573019 0%, #261308 100%);">
      
      <!-- Шапка магазина -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-amber-200/20 bg-black/20">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl sm:text-3xl">🏮</span>
          <div>
            <h2 class="text-lg sm:text-2xl font-black text-amber-50 leading-tight">Лавка Красной Панды</h2>
            <p class="text-xs text-amber-200/80 font-semibold">Украсьте колбы, лес и пригласите новых панд</p>
          </div>
        </div>

        <div class="flex items-center gap-2.5">
          <div class="hud-pill rounded-full px-3.5 py-1.5 flex items-center gap-1.5">
            <span class="text-base sm:text-lg">🪙</span>
            <span id="shopCoinsDisplay" class="text-sm sm:text-base font-black text-amber-300">120</span>
          </div>
          <button id="closeShopBtn" class="w-9 h-9 rounded-full bg-amber-950/80 border border-amber-300/40 text-amber-100 hover:bg-amber-800 flex items-center justify-center font-black text-lg transition active:scale-95" aria-label="Закрыть магазин">
            ✕
          </button>
        </div>
      </div>

      <!-- Вкладки магазина -->
      <div class="flex items-center gap-2 px-5 pt-3.5 pb-2 border-b border-amber-200/10">
        <button data-shop-tab="bottles" class="shop-tab-btn panda-btn panda-btn-accent px-4 py-2 text-xs sm:text-sm">
          🧪 Бутылки
        </button>
        <button data-shop-tab="backgrounds" class="shop-tab-btn panda-btn px-4 py-2 text-xs sm:text-sm">
          🏞️ Фоны
        </button>
        <button data-shop-tab="pandas" class="shop-tab-btn panda-btn px-4 py-2 text-xs sm:text-sm">
          🐾 Панды
        </button>
      </div>

      <!-- Сетка товаров -->
      <div id="shopItemsGrid" class="shop-scroll flex-1 overflow-y-auto p-4 sm:p-5 grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4">
        <!-- Карточки генерируются динамически через JS с мини-Canvas превью -->
      </div>
    </div>
  </div>

  <!-- Модальное окно победы на уровне -->
  <div id="winModal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="modal-pop relative w-full max-w-md rounded-3xl p-6 sm:p-8 text-center border-2 border-amber-300/60 shadow-2xl"
         style="background: radial-gradient(circle at top, #5d331a 0%, #2d170b 100%);">
      
      <!-- Декоративные ушки красной панды сверху окна -->
      <div class="absolute -top-6 left-1/2 -translate-x-1/2 flex items-center gap-16 pointer-events-none">
        <div class="w-10 h-10 rounded-tl-2xl rounded-tr-full rounded-bl-full bg-[#c94a1d] border-2 border-amber-200/70 -rotate-12 flex items-center justify-center">
          <div class="w-5 h-5 rounded-full bg-[#fff5e8]"></div>
        </div>
        <div class="w-10 h-10 rounded-tr-2xl rounded-tl-full rounded-br-full bg-[#c94a1d] border-2 border-amber-200/70 rotate-12 flex items-center justify-center">
          <div class="w-5 h-5 rounded-full bg-[#fff5e8]"></div>
        </div>
      </div>

      <div class="text-xs uppercase tracking-widest font-extrabold text-amber-300/90 mb-1">Уровень пройден!</div>
      <h2 class="text-2xl sm:text-3xl font-black text-amber-50 mb-3">Панды в восторге! 🐾</h2>

      <!-- Звёзды награды -->
      <div id="modalStars" class="flex items-center justify-center gap-3 my-3">
        <span class="text-4xl sm:text-5xl drop-shadow-lg">⭐</span>
        <span class="text-4xl sm:text-5xl drop-shadow-lg">⭐</span>
        <span class="text-4xl sm:text-5xl drop-shadow-lg">⭐</span>
      </div>

      <!-- Начисленные монеты -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-950/75 border border-amber-400/40 mb-3">
        <span class="text-xl">🪙</span>
        <span id="modalCoinsReward" class="text-base sm:text-lg font-black text-amber-300">+35 монет</span>
      </div>

      <p id="modalStatsText" class="text-amber-100/90 text-sm sm:text-base font-semibold mb-6">
        Вы справились за 10 ходов!
      </p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <button id="modalReplayBtn" class="panda-btn w-full sm:w-auto px-5 py-3 text-sm">
          Ещё раз
        </button>
        <button id="modalNextBtn" class="panda-btn panda-btn-accent w-full sm:w-auto px-6 py-3 text-sm sm:text-base">
          Следующий уровень ➜
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * СОРТИРОВКА С КРАСНЫМИ ПАНДАМИ (Red Panda Water Sort Puzzle)
     * Полностью автономный движок с физикой жидкости, экономикой монет, магазином
     * скинов (бутылки, фоны, новые персонажи панд) и вспомогательными бустерами.
     * ============================================================================
     */

    (() => {
      'use strict';

      // --- КОНСТАНТЫ И ПАЛИТРА ЦВЕТОВ ---
      const BOTTLE_CAPACITY = 4;
      const STORAGE_KEY = 'redPandaWaterSortSave_v2';

      // Природная палитра жидкостей с градиентами и бликами
      const LIQUID_PALETTE = [
        { id: 'rust',      name: 'Рыжая панда', top: '#ff7d47', mid: '#e04f1d', bottom: '#a62c08', foam: '#ffc2a6' },
        { id: 'matcha',    name: 'Бамбук',      top: '#9be066', mid: '#63b032', bottom: '#397317', foam: '#d9f7be' },
        { id: 'amber',     name: 'Хурма',       top: '#ffc94d', mid: '#e89611', bottom: '#a85f00', foam: '#fff0b3' },
        { id: 'berry',     name: 'Ежевика',     top: '#c77dff', mid: '#8e3fd4', bottom: '#53198a', foam: '#ebd1ff' },
        { id: 'sky',       name: 'Горный ручей',top: '#63d2ff', mid: '#1f9ce0', bottom: '#0d5e96', foam: '#c7f0ff' },
        { id: 'sakura',    name: 'Сакура',      top: '#ff8fb1', mid: '#e04877', bottom: '#9c1c45', foam: '#ffd1df' },
        { id: 'honey',     name: 'Лесной мёд',  top: '#f4a261', mid: '#c86d2d', bottom: '#7f3b0e', foam: '#fae0c8' },
        { id: 'teal',      name: 'Нефрит',      top: '#4fd1c5', mid: '#23968b', bottom: '#115952', foam: '#c4f7f2' }
      ];

      // --- КАТАЛОГ МАГАЗИНА ---
      const SHOP_CATALOG = {
        bottles: [
          {
            id: 'classic_panda',
            name: 'Колба «Красная панда»',
            desc: 'Стеклянная колба с милыми ушками и гравировкой лапки.',
            price: 0
          },
          {
            id: 'bamboo_vessel',
            name: 'Бамбуковый сосуд',
            desc: 'Резной стебель зелёного бамбука со свежими листочками.',
            price: 80
          },
          {
            id: 'sakura_lantern',
            name: 'Фонарик Сакуры',
            desc: 'Изящная пузатая колба с золотыми ободками и цветком.',
            price: 150
          },
          {
            id: 'royal_crystal',
            name: 'Хрустальный кувшин',
            desc: 'Гранёный хрусталь с золотыми ушками и короной.',
            price: 240
          }
        ],
        backgrounds: [
          {
            id: 'autumn_forest',
            name: 'Осенний бамбуковый лес',
            desc: 'Тёплое золото солнца, бамбук и падающие кленовые листья.',
            price: 0
          },
          {
            id: 'night_lanterns',
            name: 'Ночной сад с фонариками',
            desc: 'Глубокое звёздное небо, луна, бумажные фонарики и светлячки.',
            price: 100
          },
          {
            id: 'sakura_waterfall',
            name: 'Весенняя сакура и водопад',
            desc: 'Нежный рассвет, горный водопад и вихрь розовых лепестков.',
            price: 180
          },
          {
            id: 'winter_onsen',
            name: 'Зимний горячий источник',
            desc: 'Заснеженный бамбук, падающие снежинки и тёплый пар.',
            price: 260
          }
        ],
        pandas: [
          {
            id: 'forest_cubs',
            name: 'Лесные малыши',
            desc: 'Классические любопытные красные панды на ветках.',
            price: 0
          },
          {
            id: 'samurai_tea',
            name: 'Панда-самурай и мастер чая',
            desc: 'В плетёной шляпе каса, с шарфом и бамбуковой флейтой.',
            price: 120
          },
          {
            id: 'star_pandas',
            name: 'Звёздные панды',
            desc: 'В синих шарфиках со звёздами и сияющими золотыми ушками.',
            price: 200
          },
          {
            id: 'royal_panda',
            name: 'Королевская династия',
            desc: 'В золотых коронах, бархатных мантиях и с драгоценностями.',
            price: 300
          }
        ]
      };

      // --- СТОИМОСТЬ БУСТЕРОВ (1-й раз на уровне бесплатно, далее за монеты) ---
      const BOOSTER_COSTS = {
        hint: 20,
        shuffle: 30,
        extraBottle: 45
      };

      // --- ЗВУКОВОЙ СИНТЕЗАТОР (Web Audio API) ---
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        ensureContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }

        playSelect(pitchFactor = 1) {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(680 * pitchFactor, now);
          osc.frequency.exponentialRampToValueAtTime(1020 * pitchFactor, now + 0.08);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        }

        playDeselect() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(340, now + 0.09);

          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        }

        playCoin() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          [987.77, 1318.51].forEach((freq, i) => {
            const t = now + i * 0.07;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.15, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.26);
          });
        }

        playMagic() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const freqs = [523.25, 659.25, 783.99, 1046.5, 1318.5];
          freqs.forEach((f, i) => {
            const t = now + i * 0.045;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.11, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.3);
          });
        }

        playPour(duration = 0.55, fillRatio = 0.5) {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.Q.value = 4.5;
          const baseFreq = 380 + fillRatio * 340;
          filter.frequency.setValueAtTime(baseFreq, now);
          filter.frequency.linearRampToValueAtTime(baseFreq + 260, now + duration);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.16, now + 0.08);
          gain.gain.setValueAtTime(0.14, now + duration - 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);
          noise.stop(now + duration);

          const bubbleCount = 4;
          for (let i = 0; i < bubbleCount; i++) {
            const t = now + (duration * (i + 0.5)) / (bubbleCount + 0.5);
            const bOsc = this.ctx.createOscillator();
            const bGain = this.ctx.createGain();
            bOsc.type = 'sine';
            const startF = 320 + i * 95 + fillRatio * 180;
            bOsc.frequency.setValueAtTime(startF, t);
            bOsc.frequency.exponentialRampToValueAtTime(startF * 1.65, t + 0.065);

            bGain.gain.setValueAtTime(0.001, t);
            bGain.gain.linearRampToValueAtTime(0.07, t + 0.015);
            bGain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

            bOsc.connect(bGain);
            bGain.connect(this.ctx.destination);
            bOsc.start(t);
            bOsc.stop(t + 0.075);
          }
        }

        playBottleComplete() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const popOsc = this.ctx.createOscillator();
          const popGain = this.ctx.createGain();
          popOsc.type = 'sine';
          popOsc.frequency.setValueAtTime(190, now);
          popOsc.frequency.exponentialRampToValueAtTime(560, now + 0.07);
          popGain.gain.setValueAtTime(0.22, now);
          popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          popOsc.connect(popGain);
          popGain.connect(this.ctx.destination);
          popOsc.start(now);
          popOsc.stop(now + 0.1);

          const notes = [587.33, 739.99, 880, 1174.66];
          notes.forEach((freq, idx) => {
            const t = now + 0.04 + idx * 0.055;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.11, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.36);
          });
        }

        playWin() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const melody = [
            { f: 523.25, t: 0.00, d: 0.18 },
            { f: 659.25, t: 0.12, d: 0.18 },
            { f: 783.99, t: 0.24, d: 0.18 },
            { f: 1046.5, t: 0.38, d: 0.55 }
          ];
          melody.forEach(n => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n.f, now + n.t);
            gain.gain.setValueAtTime(0.001, now + n.t);
            gain.gain.linearRampToValueAtTime(0.16, now + n.t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + n.t);
            osc.stop(now + n.t + n.d + 0.02);
          });
        }
      }

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        return a + (b - a) * t;
      }
      function clamp(val, min, max) {

      // --- СОЗДАНИЕ ОБЪЕКТА БУТЫЛКИ С ФИЗИКОЙ ЖИДКОСТИ ---
      function createBottleObject(layers) {
        const bubbles = Array.from({ length: 7 }, () => ({
          rx: (Math.random() - 0.5) * 0.65,
          ry: Math.random(),
          r: 1.2 + Math.random() * 1.8,
          speed: 0.12 + Math.random() * 0.18,
          wobble: Math.random() * Math.PI * 2
        }));

        const isCompleted = isBottleUniformFull(layers);
        return {
          layers: [...layers],
          x: 0,
          y: 0,
          targetX: 0,
          targetY: 0,
          angle: 0,
          liftOffset: 0,
          sloshAngle: 0,
          sloshVel: 0,
          corkProgress: isCompleted ? 1 : 0,
          completed: isCompleted,
          bubbles
        };
      }

      function isBottleUniformFull(layers) {
        if (layers.length !== BOTTLE_CAPACITY) return false;
        const first = layers[0];
        return layers.every(c => c === first);
      }

      // --- ГЕНЕРАТОР РЕШАЕМЫХ УРОВНЕЙ ---
      function generateLevel(levelNum) {
        const numColors = Math.min(3 + Math.floor((levelNum - 1) / 2), 7);
        const emptyBottles = 2;

        let state = [];
        let attempts = 0;
        do {
          const pool = [];
          for (let c = 0; c < numColors; c++) {
            for (let k = 0; k < BOTTLE_CAPACITY; k++) {
              pool.push(c);
            }
          }
          for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
          }
          state = [];
          for (let b = 0; b < numColors; b++) {
            state.push(pool.slice(b * BOTTLE_CAPACITY, (b + 1) * BOTTLE_CAPACITY));
          }
          for (let e = 0; e < emptyBottles; e++) {
            state.push([]);
          }
          attempts++;
        } while (
          attempts < 30 &&
          state.some(b => b.length === BOTTLE_CAPACITY && b.every(x => x === b[0]))
        );

        gameState.level = levelNum;
        saveData.level = levelNum;
        persistSaveData();

        gameState.moves = 0;
        gameState.parMoves = numColors * 3 + Math.floor(numColors * 0.8);
        gameState.history = [];
        gameState.selectedIndex = -1;
        gameState.won = false;
        gameState.activePour = null;
        gameState.activeHint = null;
        gameState.boosterUses = { hint: 0, shuffle: 0, extraBottle: 0 };
        gameState.particles = [];

        gameState.initialSnapshot = state.map(b => [...b]);
        gameState.bottles = state.map(b => createBottleObject(b));

        layoutBottles(true);
        updateHUD();
        hideWinModal();
      }

        if (gameState.activePour) return;
        gameState.moves = 0;
        gameState.history = [];
        gameState.selectedIndex = -1;
        gameState.won = false;
        gameState.activePour = null;
        gameState.activeHint = null;
        gameState.boosterUses = { hint: 0, shuffle: 0, extraBottle: 0 };
        gameState.bottles = gameState.initialSnapshot.map(b => createBottleObject(b));
        layoutBottles(true);
        updateHUD();
        hideWinModal();
        sound.playDeselect();
        showToast('Уровень начат заново');
